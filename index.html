<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Report | Ahmed Safwan Sajid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --surface: #121216; --text: #f8f9fa; 
            --text-secondary: #a0a0b0; --accent: #6366f1; --border: rgba(255,255,255,0.08);
        }
        [data-theme="light"] {
            --bg: #ffffff; --surface: #f8f9fa; --text: #0a0a0c; 
            --text-secondary: #555566; --accent: #4f46e5; --border: rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        
        header { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface); }
        header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        header p { color: var(--text-secondary); font-size: 0.95rem; }
        header .author { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.85rem; margin-top: 0.5rem; }

        main { flex: 1; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        
        .controls { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .btn { padding: 0.6rem 1.2rem; background: var(--accent); color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: 0.2s; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;}
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .theme-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; }

        .pdf-container { width: 100%; max-width: 1000px; flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        iframe { width: 100%; height: 85vh; border: none; background: #fff; }

        footer { padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.8rem; border-top: 1px solid var(--border); }
        footer a { color: var(--accent); text-decoration: none; }

        @media (max-width: 768px) {
            iframe { height: 60vh; }
            .controls { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <!-- EDIT: Update your report title and details here -->
        <h1>Bangladesh Commodity Trading Strategy Report</h1>
        <p>This report explores the dynamics of commodity trading in Bangladesh, focusing on key markets, price trends, and strategic opportunities.</p>
        <div class="author">Ahmed Safwan Sajid | <div June,="" 2026=""></div></div>
    </header>

    <main>
        <div class="controls">
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌓</button>
            <!-- IMPORTANT: Change 'report.pdf' to your actual PDF filename -->
            <a href="Bangladesh_Commodity_Trading_Strategy_Report.pdf" download class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                Download PDF
            </a>
        </div>

        <div class="pdf-container">
            <!-- IMPORTANT: Change 'report.pdf' to your actual PDF filename -->
            <iframe src="Bangladesh_IVF_Regulatory_Roadmap.pdf" title="Research Report PDF"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Ahmed Safwan Sajid. <a href="https://yourusername.github.io/portfolio" target="_blank">Back to Portfolio</a></p>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const setTheme = (t) => { html.setAttribute('data-theme', t); localStorage.setItem('theme', t); };
        setTheme(localStorage.getItem('theme') || 'dark');
        toggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
</html>
